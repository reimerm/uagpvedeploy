# uag-pve-api-example.ini
# Example INI for uagdeploypve.ps1 / uagdeploypve.psm1: one file describes
# one UAG instance, the same way a vSphere INI does for uagdeploy.ps1.
#
# Comments must use "#", not ";". ImportIni (from uagdeploy.psm1) only
# recognizes "#"; a ";" line is not skipped and can crash the parser if it
# looks like key=value.
#
# One-time setup, once per cluster/storage:
#   pwsh ./New-UagPveTemplate.ps1 -ProxmoxHost pve.example.com -Node pve-node1 `
#       -Storage local -Qcow2Image /var/lib/vz/images/euc-unified-access-gateway-<version>.qcow2 `
#       -ProxmoxPassword (Get-Credential -UserName 'root@pam').Password
# Prints a VMID, put it in templateVmid below.
#
# One-time setup, once per node: Proxmox has no API for uploading cloud-init
# snippets (see README's "Known gotchas"), so this tool delivers them over
# SSH to a dedicated non-root user with one scoped sudoers rule:
#   useradd -m -s /bin/bash uag-snippets
#   ssh-keygen -t ed25519 -f uag-snippets-key -N ''
#   # copy the public key to /home/uag-snippets/.ssh/authorized_keys
#   # via visudo -f /etc/sudoers.d/uag-snippets:
#   uag-snippets ALL=(root) NOPASSWD: /usr/bin/tee /var/lib/vz/snippets/[a-zA-Z0-9_][a-zA-Z0-9_.-]*
# See README.md for the full setup steps.
#
# Usage:
#   pwsh ./uagdeploypve.ps1 -IniFile ./uag-pve-api-example.ini `
#       -RootPwd 'yourRootPwd' -AdminPwd 'yourAdminPwd' `
#       -ApiToken 'root@pam!uagdeploy=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'
# (or set $env:PVE_API_TOKEN instead of -ApiToken)
#
# All values below are placeholders. Replace them with your own.

[General]
# Same fields uagdeploy*.ps1 already understands.
name=uag-proxmox-01
defaultGateway=192.168.1.1
deploymentOption=onenic
ipMode0=STATICV4
ip0=192.168.1.50
netmask0=255.255.255.0
DNS=192.168.1.1
sshEnabled=true
sshPasswordAccessEnabled=true

[Platform]
type=proxmox

# 'host' is the API endpoint; 'node' is the cluster member to deploy onto.
host=pve.example.com
node=pve-node1

# Omit 'vmid' to auto-assign the next free ID. Uncomment to pin one:
# vmid=100

# VMID of the template from New-UagPveTemplate.ps1; cloned for each deploy.
templateVmid=9000

storage=local
# snippetStorage defaults to 'storage' if omitted.
# snippetStorage=local

bridge=vmbr0
memoryMB=4096
cores=2

# Snippet delivery over SSH (required, see notes above).
snippetSshUser=uag-snippets
snippetSshKeyPath=./uag-snippets-key
# snippetSshPort defaults to 22.
# snippetSshPort=22
# sshHost defaults to 'host'; override in a multi-node cluster if needed.
# sshHost=pve-node1.example.com

[Smbios]
# Optional; these are also the defaults.
manufacturer=Nutanix
product=AHV
version=1.0
