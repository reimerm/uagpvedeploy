# uag-pve-api-example.ini
# Example unified INI for uagdeploypve.ps1 + uagdeploypve.psm1 (Phase 3,
# API-driven Proxmox deployment, template+clone design). One file fully
# describes one UAG instance, the same way a vSphere INI does for
# uagdeploy.ps1 - see uag-kvm-adaptation-plan.md section 7 for the design
# behind this.
#
# IMPORTANT: comments in this file MUST use "#", not ";". ImportIni (the
# real uagdeploy.psm1 function this reuses) only recognizes "#" as a
# comment prefix - a ";" line is NOT skipped, and if it happens to contain
# something matching a bare "key=value" pattern anywhere in the line
# (easy to trigger by accident, e.g. an example command in a comment),
# ImportIni will try to parse it as real INI content and can crash if it
# appears before the first [Section] header. Confirmed the hard way while
# building this file - see uag-kvm-adaptation-plan.md section 7.7.
#
# ONE-TIME PREREQUISITE: before this (or any) deployment INI can be used,
# a Proxmox template has to exist once for the cluster/storage in
# question - build it with:
#   pwsh ./New-UagPveTemplate.ps1 -ProxmoxHost 65.109.18.154 -Node ax161-01 `
#       -Storage local -Qcow2Image /var/lib/vz/images/euc-unified-access-gateway-26.06.0.0-32063449787_OVF10.qcow2 `
#       -ProxmoxPassword (Get-Credential -UserName 'root@pam').Password
# That prints a VMID - put it in this file's [Platform] templateVmid
# below. It needs a real root login once (or an API token against a
# storage with the 'import' content type enabled - see -ApiToken in that
# script's help, NOT yet live-tested); every actual deployment after that
# (this file, via uagdeploypve.ps1) only needs a plain API token plus the
# SFTP settings below.
#
# ANOTHER ONE-TIME PREREQUISITE, per node that will host deployments:
# Proxmox has NO API for uploading cloud-init snippets at all - confirmed
# against a live 400 error and external research (bugzilla #2208, open
# 7+ years, still true on current Proxmox VE 9 - the same gap
# bpg/terraform-provider-proxmox, the standard Terraform provider for
# Proxmox, independently ran into and documents). See
# uag-kvm-adaptation-plan.md section 7.10 for the full writeup and the
# one-time node-side setup this project adopted to match that provider's
# approach: a plain non-root user with ONE scoped sudoers rule (NOT root,
# NOT a chroot jail), e.g.:
#   useradd -m -s /bin/bash uag-snippets
#   # NOT /usr/sbin/nologin - SSH still runs remote commands through the
#   # account's shell even for a one-off command, so nologin breaks this
#   # (hit live 2026-09-10: "This account is currently not available").
#   # See section 7.10 for the full explanation.
#   ssh-keygen -t ed25519 -f uag-snippets-key -N ''
#   # ... authorized_keys setup, see section 7.10 for the full steps ...
#   # then, via visudo -f /etc/sudoers.d/uag-snippets:
#   uag-snippets ALL=(root) NOPASSWD: /usr/bin/tee /var/lib/vz/snippets/[a-zA-Z0-9_][a-zA-Z0-9_.-]*
# (adjust the /var/lib/vz/snippets path to match whichever storage
# snippetStorage below actually points at)
#
# Usage:
#   pwsh ./uagdeploypve.ps1 -IniFile ./uag-pve-api-example.ini `
#       -RootPwd 'yourRootPwd' -AdminPwd 'yourAdminPwd' `
#       -ApiToken 'root@pam!uagdeploy=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'
#
# (Or set $env:PVE_API_TOKEN instead of -ApiToken.)
#
# Values below match the environment already live-validated in
# uag-kvm-status.md (node ax161-01, VMID 999, storage local, bridge
# vmbr1) as a starting point - adjust for your own deployment.

[General]
# Unchanged from the existing Get-UagUserData.ps1 payload format - every
# field it already understands works exactly the same here. See
# uag-lab-test.ini for the full list of optional fields; this is just the
# minimal working set matching the live-validated Proxmox test.
name=uag-proxmox-01
defaultGateway=10.5.0.1
deploymentOption=onenic
ipMode0=STATICV4
ip0=10.5.0.99
netmask0=255.255.255.0
DNS=10.5.0.1
sshEnabled=true
sshPasswordAccessEnabled=true

[Platform]
type=proxmox

# The Proxmox host/API endpoint to talk to (not necessarily the same as
# 'node' below in a multi-node cluster - 'host' is where the API lives,
# 'node' is which cluster member to deploy onto).
host=65.109.18.154
node=ax161-01

# Leave 'vmid' unset entirely to have uagdeploypve.ps1 ask Proxmox for the
# next free VMID automatically (via /cluster/nextid) - the actual Phase 3
# goal. Uncomment to pin one instead:
# vmid=999

# VMID of a template already built by New-UagPveTemplate.ps1 (see the
# comment near the top of this file). This is what gets CLONED for every
# deployment - the golden QCOW2 itself is only ever touched once, when
# that template is built, not by this file.
templateVmid=109

storage=local
# snippetStorage defaults to 'storage' above if omitted. Only used to
# build the cicustom=meta=...,user=... reference Proxmox looks up at VM
# start - the files themselves are delivered over SFTP (see below), not
# through this storage's API.
# snippetStorage=local

bridge=vmbr1
memoryMB=4096
cores=2

# Snippet delivery (MANDATORY - uagdeploypve.ps1 refuses to run without
# these). Proxmox has no API for uploading cloud-init snippets on any
# version (see the note near the top of this file and
# uag-kvm-adaptation-plan.md section 7.10), so this goes over SSH instead
# (sudo+tee, the same mechanism bpg/terraform-provider-proxmox uses), to a
# dedicated, one-time-created, non-root user with ONE scoped sudoers rule
# - NOT root, and NOT the API token used for everything else.
snippetSshUser=uag-snippets
snippetSshKeyPath=C:\Users\mirco\Documents\CoWork\uag-snippets-key
# snippetSshPort defaults to 22 if omitted.
# snippetSshPort=22
# sshHost defaults to 'host' above if omitted - override only if the node
# hosting this deployment isn't reachable at the same address as the
# cluster API endpoint (relevant in a multi-node cluster).
# sshHost=ax161-01.lab.local

[Smbios]
# Optional - these are also the built-in defaults if this section is
# omitted entirely. Only needed if a different spoofed platform is ever
# required (e.g. testing the OpenShift/KubeVirt detection branch instead).
manufacturer=Nutanix
product=AHV
version=1.0
